<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pulse Check</title>
<meta name="description" content="Quick mood, anxiety, stress and energy check-ins, compared with your Oura data.">
<meta name="theme-color" content="#0f766e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Pulse Check">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<style>
:root{
  --bg:#f5f4ef; --card:#ffffff; --text:#1c2430; --muted:#5b6776; --line:#e2e0d8;
  --accent:#0f766e; --accent-ink:#ffffff; --accent-soft:#d9efec;
  --warn-bg:#fdf3dc; --warn-ink:#6b4a05; --danger:#b42318;
  --c-mood:#0f766e; --c-anxiety:#c2410c; --c-stress:#7c3aed; --c-energy:#1d4ed8; --c-oura:#64748b;
  --on-c:#ffffff;
  --shadow:0 1px 2px rgba(20,30,40,.06),0 4px 14px rgba(20,30,40,.05);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#11161b; --card:#1a2128; --text:#e7edf3; --muted:#9aa8b6; --line:#2a333c;
    --accent:#2dd4bf; --accent-ink:#06211e; --accent-soft:#16403c;
    --warn-bg:#3a2e12; --warn-ink:#f2d58b; --danger:#f97066;
    --c-mood:#2dd4bf; --c-anxiety:#fb923c; --c-stress:#a78bfa; --c-energy:#60a5fa; --c-oura:#94a3b8;
    --on-c:#0b1218; --shadow:none;
  }
}
:root[data-theme="dark"]{
  --bg:#11161b; --card:#1a2128; --text:#e7edf3; --muted:#9aa8b6; --line:#2a333c;
  --accent:#2dd4bf; --accent-ink:#06211e; --accent-soft:#16403c;
  --warn-bg:#3a2e12; --warn-ink:#f2d58b; --danger:#f97066;
  --c-mood:#2dd4bf; --c-anxiety:#fb923c; --c-stress:#a78bfa; --c-energy:#60a5fa; --c-oura:#94a3b8;
  --on-c:#0b1218; --shadow:none;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-tap-highlight-color:transparent}
#app{max-width:560px;margin:0 auto;padding:0 16px calc(86px + env(safe-area-inset-bottom))}
.top{display:flex;align-items:center;justify-content:space-between;padding:calc(14px + env(safe-area-inset-top)) 2px 10px}
.brand{display:flex;align-items:center;gap:8px;font-weight:700;letter-spacing:.2px}
.brand svg{width:26px;height:26px;color:var(--accent)}
.date{color:var(--muted);font-size:14px}
h1,h2,h3{margin:0;line-height:1.25}
h2{font-size:18px;margin-bottom:6px}
h3{font-size:16px;font-weight:600}
.section-t{font-size:13px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:26px 2px 10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin:0 0 12px;box-shadow:var(--shadow)}
.muted{color:var(--muted)} .small{font-size:13px} .opt{font-weight:400;color:var(--muted);font-size:13px}
.hero h1{font-size:22px}
.hero p{margin:4px 0 0;color:var(--muted)}
.dots{display:flex;gap:7px;margin-top:12px;align-items:center}
.dots i{width:12px;height:12px;border-radius:50%;border:2px solid var(--accent);display:block}
.dots i.on{background:var(--accent)}
.dots span{font-size:13px;color:var(--muted);margin-left:4px}
.notice{background:var(--warn-bg);color:var(--warn-ink);border-radius:12px;padding:10px 12px;margin:0 0 12px;font-size:14px}
.notice .link{color:inherit}
.metric-h{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px;gap:8px}
.scale{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.scale button{appearance:none;font:inherit;font-weight:600;min-height:48px;border-radius:12px;border:1.5px solid var(--line);background:transparent;color:var(--text);cursor:pointer;transition:transform .08s,background .12s}
.scale button:active{transform:scale(.94)}
.scale button.on{background:var(--mc);border-color:var(--mc);color:var(--on-c)}
.ends{display:flex;justify-content:space-between;color:var(--muted);font-size:12.5px;margin-top:6px}
button{font:inherit}
button:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible,a:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.link{background:none;border:0;padding:2px 0;color:var(--accent);text-decoration:underline;cursor:pointer;font-size:14px}
.link.danger{color:var(--danger)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{appearance:none;border:1.5px solid var(--line);background:transparent;color:var(--text);padding:7px 12px;border-radius:999px;font-size:14.5px;cursor:pointer}
.chip.on{background:var(--accent-soft);border-color:var(--accent);color:var(--text);font-weight:600}
.chip .x{margin-left:6px;color:var(--muted)}
input[type=text],input[type=password],input[type=time],input[type=datetime-local],select{font:inherit;color:var(--text);background:var(--bg);border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;width:100%}
select{width:auto;padding:8px 10px}
.whenrow{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:14px;margin:2px 2px 14px;flex-wrap:wrap}
.whenrow input{width:auto}
.primary,.btn{appearance:none;border-radius:12px;border:1.5px solid var(--accent);padding:10px 16px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;text-align:center;color:var(--accent);background:transparent}
.primary{background:var(--accent);color:var(--accent-ink)}
.primary.big{width:100%;min-height:52px;font-size:17px}
.primary[disabled],.btn[disabled]{opacity:.55;cursor:default}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:10px}
.row.sp{justify-content:space-between}
.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:flex;justify-content:center;padding:6px 8px calc(6px + env(safe-area-inset-bottom));z-index:5}
.tabs a{flex:1;max-width:140px;text-decoration:none;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px;padding:6px 0;border-radius:12px}
.tabs a svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.tabs a[aria-current=page]{color:var(--accent);font-weight:700}
#toast{position:fixed;left:50%;bottom:calc(88px + env(safe-area-inset-bottom));transform:translate(-50%,20px);background:var(--text);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:14px;opacity:0;pointer-events:none;transition:.2s;z-index:10;max-width:88vw;text-align:center}
#toast.show{opacity:1;transform:translate(-50%,0)}
.seg{display:inline-flex;border:1.5px solid var(--line);border-radius:12px;overflow:hidden;background:var(--card)}
.seg button{border:0;background:transparent;color:var(--text);padding:8px 14px;cursor:pointer;font-size:14px}
.seg button[aria-pressed=true]{background:var(--accent);color:var(--accent-ink);font-weight:700}
.opts{display:flex;gap:12px;flex-wrap:wrap;margin:10px 0 0;font-size:13px;color:var(--muted)}
.opts label{display:flex;flex-direction:column;gap:4px}
.insight{display:grid;gap:4px}
.insight .k{font-size:12px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.insight p{margin:0}
.insight .sub{color:var(--muted);font-size:14px}
.pill{display:inline-block;border:1px solid var(--line);border-radius:999px;padding:2px 9px;font-size:12px;color:var(--muted);margin-right:6px}
.pill.strong{border-color:var(--accent);color:var(--accent)}
.insight.care{border-color:var(--accent);background:var(--accent-soft)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tr{padding:12px}
.tr .lab{font-size:13px;color:var(--muted);display:flex;align-items:center;gap:6px}
.tr .lab i{width:9px;height:9px;border-radius:50%;background:var(--mc);display:inline-block}
.tr .big{font-size:26px;font-weight:700;line-height:1.1;margin-top:2px}
.tr .delta{font-size:13px;color:var(--muted)}
.spark{width:100%;height:36px;display:block;margin-top:6px}
.matrix{width:100%;border-collapse:separate;border-spacing:3px;font-size:13px}
.matrix th{font-weight:600;color:var(--muted);text-align:center;font-size:12px;padding:2px}
.matrix th.rl{text-align:left;color:var(--text);font-weight:500;font-size:13px;width:34%}
.matrix td{text-align:center;border-radius:8px;padding:9px 2px;cursor:pointer;font-variant-numeric:tabular-nums;border:1px solid transparent}
.matrix td.na{color:var(--muted);cursor:default;background:transparent}
.matrix td.sig{font-weight:700;border-color:var(--text)}
.matrix td:focus-visible{outline:3px solid var(--accent)}
.legend{display:flex;gap:12px;align-items:center;font-size:12px;color:var(--muted);margin-top:8px;flex-wrap:wrap}
.legend i{display:inline-block;width:14px;height:14px;border-radius:4px;vertical-align:-2px;margin-right:4px}
.charts svg{width:100%;height:auto;display:block}
.ax{stroke:var(--line);stroke-width:1}
.tx{fill:var(--muted);font-size:10.5px}
.tt{fill:var(--text);font-size:11px;font-weight:600}
.cal{width:100%;height:auto}
.cal-l{fill:var(--muted);font-size:10px}
.cal-empty{fill:none;stroke:var(--line);stroke-width:1}
.bar-row{display:grid;grid-template-columns:92px 1fr 70px;gap:8px;align-items:center;margin:7px 0;font-size:14px}
.bar{height:12px;background:var(--bg);border-radius:6px;overflow:hidden;border:1px solid var(--line)}
.bar i{display:block;height:100%}
.bar-v small{color:var(--muted);margin-left:4px;font-size:11px}
.fx{width:100%;border-collapse:separate;border-spacing:3px;font-size:13px}
.fx th{font-size:12px;color:var(--muted);font-weight:600;text-align:center}
.fx td{text-align:center;border-radius:8px;padding:8px 2px;font-variant-numeric:tabular-nums}
.fx td.tg{text-align:left;font-weight:600;padding-left:4px}
.fx td.tg small{display:block;color:var(--muted);font-weight:400}
details{margin-top:10px}
summary{cursor:pointer;font-weight:600;padding:6px 0}
.day-h{font-size:13px;font-weight:700;color:var(--muted);margin:20px 2px 8px}
.entry .top2{display:flex;justify-content:space-between;color:var(--muted);font-size:13px}
.entry .vals{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}
.entry .v{font-size:13px;padding:3px 9px;border-radius:8px;background:var(--bg);border:1px solid var(--line)}
.entry .v b{color:var(--mc)}
.entry .note{font-style:italic;margin:6px 0 0;color:var(--text)}
.entry .tags{font-size:13px;color:var(--muted);margin-top:6px}
.field{margin:10px 0}
.field label{display:block;font-size:13px;color:var(--muted);margin-bottom:4px}
.trow{display:flex;gap:8px;align-items:center;margin:6px 0}
.trow input{max-width:150px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:14px}
.kv dt{color:var(--muted)} .kv dd{margin:0}
.msg-ok{color:var(--accent)} .msg-err{color:var(--danger)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
.ih{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.ih .sub2{font-size:12px;color:var(--muted)}
.pill.conf-confirmed{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:700}
.pill.conf-likely{border-color:var(--accent);color:var(--accent);font-weight:600}
.pill.conf-hint{border-style:dashed}
details.stats{margin-top:2px}
details.stats summary{font-weight:500;font-size:13px;color:var(--accent);padding:2px 0}
details.stats p{margin:6px 0 0}
.matrix td.likely{border:1.5px solid var(--text)}
.matrix td.conf{border:2.5px solid var(--text);font-weight:700}
.fx td.likely{box-shadow:inset 0 0 0 1.5px var(--text)}
.fx td.conf{box-shadow:inset 0 0 0 2.5px var(--text);font-weight:700}
.tw{overflow-x:auto;-webkit-overflow-scrolling:touch}
.outlook{border-width:2px}
.outlook.harder{border-color:var(--c-anxiety)}
.outlook.better{border-color:var(--accent)}
.outlook h2{font-size:19px;margin:4px 0}
.dg{display:grid;grid-template-columns:auto 1fr auto;gap:6px 12px;font-size:14.5px;align-items:baseline}
.dg .better{color:var(--accent);font-size:12.5px;font-weight:600}
.dg .worse{color:var(--c-anxiety);font-size:12.5px;font-weight:600}
.tog{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--text);margin-top:10px;cursor:pointer}
.tog input{width:20px;height:20px;accent-color:var(--accent);margin:0}
.phq-q{margin:14px 0 6px;font-weight:600}
.phq-o{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.phq-o button{appearance:none;border:1.5px solid var(--line);background:transparent;color:var(--text);border-radius:10px;padding:10px 8px;font-size:14px;cursor:pointer;text-align:center;min-height:44px}
.phq-o button.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.prog{height:8px;background:var(--bg);border:1px solid var(--line);border-radius:6px;overflow:hidden;margin:10px 0 6px}
.prog i{display:block;height:100%;background:var(--accent)}
.stab{width:100%;border-collapse:collapse;font-size:13.5px}
.stab th{font-size:12px;color:var(--muted);font-weight:600;text-align:right;padding:4px}
.stab th:first-child,.stab td:first-child{text-align:left}
.stab td{padding:7px 4px;text-align:right;border-top:1px solid var(--line);font-variant-numeric:tabular-nums}
.exp-res{display:grid;grid-template-columns:1fr auto;gap:5px 12px;font-size:14px;margin-top:8px;font-variant-numeric:tabular-nums}
.verdict{font-weight:700}
.verdict.good{color:var(--accent)}
.verdict.bad{color:var(--c-anxiety)}
.hero .exp{margin-top:10px;font-size:13.5px;color:var(--muted)}
.kicker{font-size:12px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
ul.notes{margin:10px 0 0;padding-left:18px;font-size:13.5px}
ul.notes li{margin:4px 0}
.hint-list .card{box-shadow:none}
</style>
</head>
<body>
<div id="app">
  <header class="top">
    <div class="brand">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12h4l3-7 4 14 3-7h6"/></svg>
      <span>Pulse Check</span>
    </div>
    <div class="date" id="today-label"></div>
  </header>
  <div id="storage-warn" class="notice" hidden>Your browser is blocking local storage, so check-ins won't be kept after you close this page. Try opening the app in a normal (non-private) window or install it to your home screen.</div>
  <main>
    <section id="view-checkin"><div id="hero" class="card hero"></div><div id="phq-card"></div><div id="edit-banner" class="notice" hidden></div><form id="checkin-form" autocomplete="off"></form></section>
    <section id="view-insights" hidden></section>
    <section id="view-history" hidden></section>
    <section id="view-data" hidden></section>
  </main>
  <nav class="tabs" aria-label="Main">
    <a href="#checkin" data-tab="checkin"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 8v8M8 12h8"/></svg>Check-in</a>
    <a href="#insights" data-tab="insights"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 20V11M12 20V4M19 20v-6"/></svg>Insights</a>
    <a href="#history" data-tab="history"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 6h12M8 12h12M8 18h12M4 6h.01M4 12h.01M4 18h.01"/></svg>History</a>
    <a href="#data" data-tab="data"><svg viewBox="0 0 24 24" aria-hidden="true"><ellipse cx="12" cy="6" rx="7" ry="3"/><path d="M5 6v12c0 1.7 3.1 3 7 3s7-1.3 7-3V6M5 12c0 1.7 3.1 3 7 3s7-1.3 7-3"/></svg>Data</a>
  </nav>
</div>
<div id="toast" role="status" aria-live="polite"></div>

<script>
(function(){
'use strict';

/* =====================================================================
   Helpers
   ===================================================================== */
const $ = (s, r=document) => r.querySelector(s);
const $$ = (s, r=document) => Array.from(r.querySelectorAll(s));
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad = n => String(n).padStart(2,'0');
const ymd = d => d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const parseYmd = s => { const [y,m,d] = s.split('-').map(Number); return new Date(y, m-1, d); };
const addDays = (d,n) => new Date(d.getFullYear(), d.getMonth(), d.getDate()+n);
const mean = a => a.reduce((s,v)=>s+v,0)/a.length;
const sd = a => { if (a.length<2) return 0; const m=mean(a); return Math.sqrt(a.reduce((s,v)=>s+(v-m)**2,0)/(a.length-1)); };
const median = a => { if (!a.length) return null; const s=[...a].sort((x,y)=>x-y), n=s.length; return n%2 ? s[(n-1)/2] : (s[n/2-1]+s[n/2])/2; };
const clamp = (v,lo,hi) => Math.max(lo, Math.min(hi, v));
const fmt = (v,d=1) => (v==null || !isFinite(v)) ? '–' : (+v).toFixed(d);
const sgn = (v,d=1) => { if (v==null||!isFinite(v)) return '–'; const s=Math.abs(v).toFixed(d); return (+s===0 ? '' : v>0 ? '+' : '−') + s; };
const nice = v => { const a=Math.abs(v); return v.toFixed(a>=10?0:a>=1?1:2); };
const sgnN = v => { if (v==null||!isFinite(v)) return '–'; const s=nice(Math.abs(v)); return (+s===0 ? '' : v>0 ? '+' : '−') + s; };
const fp = p => p==null||!isFinite(p) ? '–' : p<0.001 ? '< 0.001' : p.toFixed(3);
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,6);
const todayStr = () => ymd(new Date());
const maxOf = a => a.reduce((m,v)=>v>m?v:m, -Infinity);
const slug = s => String(s).toLowerCase().replace(/\.[a-z0-9]+$/,'').replace(/[^a-z0-9]+/g,'_').replace(/^_|_$/g,'');
const SHIFT = new Map();
const shift = (d,n) => { const k=d+'|'+n; let v=SHIFT.get(k); if (!v){ v=ymd(addDays(parseYmd(d),n)); SHIFT.set(k,v); } return v; };
const daysBetween = (a,b) => Math.round((parseYmd(b)-parseYmd(a))/864e5);
const shortDate = d => parseYmd(d).toLocaleDateString([], {month:'short', day:'numeric'});
let toastT;
function toast(msg){ const t=$('#toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove('show'),2800); }

/* =====================================================================
   Constants
   ===================================================================== */
const METRICS = [
  {k:'mood',    label:'Mood',    q:'How is your mood?',        lo:'Very low', hi:'Great',        color:'--c-mood'},
  {k:'anxiety', label:'Anxiety', q:'How anxious do you feel?', lo:'Calm',     hi:'Very anxious', color:'--c-anxiety'},
  {k:'stress',  label:'Stress',  q:'How stressed do you feel?',lo:'Relaxed',  hi:'Overwhelmed',  color:'--c-stress'},
  {k:'energy',  label:'Energy',  q:'How is your energy?',      lo:'Drained',  hi:'Energized',    color:'--c-energy'}
];
const M = Object.fromEntries(METRICS.map(m=>[m.k,m]));
const LAB = k => k==='overall' ? 'Overall' : M[k].label;
const GOOD_UP = k => k==='mood' || k==='energy' || k==='overall';

const OURA = [
  {k:'sleep_score',      label:'Sleep score',          p:'sleep score',          unit:'',    dec:0},
  {k:'total_sleep_h',    label:'Sleep duration',       p:'sleep duration',       unit:' h',  dec:1},
  {k:'sleep_eff',        label:'Sleep efficiency',     p:'sleep efficiency',     unit:'%',   dec:0},
  {k:'deep_min',         label:'Deep sleep',           p:'deep sleep',           unit:' min',dec:0},
  {k:'rem_min',          label:'REM sleep',            p:'REM sleep',            unit:' min',dec:0},
  {k:'latency_min',      label:'Time to fall asleep',  p:'time to fall asleep',  unit:' min',dec:0},
  {k:'avg_hrv',          label:'HRV (sleep avg)',      p:'HRV',                  unit:' ms', dec:0},
  {k:'lowest_hr',        label:'Lowest heart rate',    p:'lowest heart rate',    unit:' bpm',dec:0},
  {k:'avg_hr',           label:'Avg sleeping HR',      p:'average sleeping heart rate', unit:' bpm', dec:0},
  {k:'readiness_score',  label:'Readiness score',      p:'readiness score',      unit:'',    dec:0},
  {k:'temp_dev',         label:'Temp deviation',       p:'temperature deviation',unit:' °C', dec:2},

const expEnd = x => shift(x.start, x.days-1);
const expLast = x => x.ended && x.ended<expEnd(x) ? x.ended : expEnd(x);

function expResult(x){
  const td=todayStr(), endEff=expLast(x)<td?expLast(x):td;

  const fitK=getV=>{
    const rows=[]; for (let d=parseYmd(bStart); ymd(d)<=endEff; d=addDays(d,1)){ const ds=ymd(d), v=getV(ds); if (v==null) continue; const ex=ds>=x.start?1:0, g=d.getDay(); rows.push({y:v, x:[ex, g===0||g===6?1:0], ex}); }

function phqCalib(ctx){

  const out=[], days=[];

  }
  const lp=S.phq[S.phq.length-1];
  if (lp && Date.now()-lp.ts<14*864e5){
    const s=phqScore(lp);
    if (s.anx>=3||s.dep>=3) out.push({care:true, k:'Weekly check', title:`Your latest weekly check scored ${s.total} of 12 (${phqBand(s.total).toLowerCase()})`,

function calendarSvg(mk){
  const dm=dayMap(UI.slot), today=new Date(), dow=(today.getDay()+6)%7, weeks=12;
  const start=addDays(today, -(dow+7*(weeks-1))); const cell=22,gap=3,left=16,top=3;
  let s=`<svg class="cal" viewBox="0 0 ${left+weeks*(cell+gap)} ${top+7*(cell+gap)}" role="img" aria-label="Calendar of daily ${M[mk].label.toLowerCase()}, last 12 weeks">`;
  ['M','T','W','T','F','S','S'].forEach((l,i)=>s+=`<text class="cal-l" x="0" y="${top+i*(cell+gap)+cell*0.68}">${l}</text>`);
  for (let w=0;w<weeks;w++) for (let d=0;d<7;d++){
    const dt=addDays(start,w*7+d); if (dt>today) continue; const ds=ymd(dt); const v=dm[ds]&&dm[ds][mk];
    const x=left+w*(cell+gap), y=top+d*(cell+gap);
    s+= v==null ? `<rect class="cal-empty" x="${x}" y="${y}" width="${cell}" height="${cell}" rx="5" data-d="${ds}"/>`
                : `<rect x="${x}" y="${y}" width="${cell}" height="${cell}" rx="5" fill="var(${M[mk].color})" fill-opacity="${(0.12+0.88*(v-1)/6).toFixed(2)}" data-d="${ds}" data-v="${v.toFixed(1)}"/>`;
  }
  return s+'</svg>';
}

const rhoColor=r=>{ const a=(Math.min(1,Math.abs(r)/0.6)*0.6).toFixed(2); return r>0?`rgba(234,88,12,${a})`:`rgba(37,99,235,${a})`; };

function assocCard(t){
  const o=ouraMeta(t.ok), m=M[t.mk], th=threshold(t.predRaw,t.outRaw); let body=unitEffect(t);
  if (th){ const gap=Math.abs(th.hiMean-th.loMean), minGap=t.dir==='next'?0.3*(sd(t.outRaw)||1):0.4; if (gap>=minGap) body+=' '+thrText(t,th); }
  return {k:`${o.label} ↔ ${m.label}`, sub:DIR_LAB[t.dir], conf:t.conf, title:assocTitle(t), body, details:assocDetails(t), explore:{dir:t.dir, mk:t.mk, ok:t.ok}};
}
function tagCard(c){
  const halves=c.halves[0]!=null&&c.halves[1]!=null?`First half of your data: ${sgn(c.halves[0],1)}; second half: ${sgn(c.halves[1],1)}.`:'Not enough data yet to check both halves.';
  return {k:`${c.tag} ↔ ${M[c.mk].label}`, conf:c.conf,
    title:`"${c.tag}" goes with ${sgn(c.b,1)} ${M[c.mk].label.toLowerCase()} points.`,
    body:`That allows for time of day, weekends and your other tags${Math.abs(c.raw-c.b)>=0.2?`, which explain part of the raw gap (${sgn(c.raw,1)})`:''}. ${c.n1} check-ins with it, ${c.n2} without.${S.settings.tagScope==='day'?' A tag counts for the rest of that day.':''}`,
    details:esc(`p = ${fp(c.p)}; after correcting for all tag comparisons, q = ${fp(c.q)}. Check-ins on the same day are treated as related, not independent. ${halves}`)};
}
function tagSleepCard(c){

  return {k:`${c.tag} → ${o.label}`, sub:'Today → tonight', conf:c.conf,
    title:`Days tagged "${c.tag}" are followed by ${sgnN(c.b)}${o.unit} ${o.p} that night.`,
    body:`Allowing for the night before, weekends and your other tags. ${c.n1} days with it, ${c.n2} without.`,
    details:esc(`p = ${fp(c.p)}, q = ${fp(c.q)}. ${c.halves[0]!=null&&c.halves[1]!=null?`First half: ${sgnN(c.halves[0])}, second half: ${sgnN(c.halves[1])}.`:''}`)};
}
function hrCard(t){

    details:esc(`Rank correlation ${sgn(t.rho,2)}, p = ${fp(t.p)}, q = ${fp(t.q)}. Workouts and sleep are excluded.`)};

function comboCard(c){
  const oa=ouraMeta(c.a), ob=ouraMeta(c.b), wa=c.ra>0?'lower':'higher', wb=c.rb>0?'lower':'higher';
  return {k:'Combination', conf:c.conf,
    title:`On days with both ${wa} ${oa.p} and ${wb} ${ob.p}, your overall score is ${fmt(Math.abs(c.diff))} points ${c.diff<0?'lower':'higher'} than on other days.`,
    body:`That's a bigger ${c.diff<0?'dip':'change'} than either alone (${sgn(c.dA,1)} and ${sgn(c.dB,1)}). "${wa[0].toUpperCase()+wa.slice(1)}" and "${wb}" mean the worse half of your days. ${c.nb} days had both.`,
    details:esc(`Welch t-test p = ${fp(c.p)}; q = ${fp(c.q)} across ${c.m} pairs tested.`)};
}
function patternCards(A){
  const cards=[], ents=entriesInView();
  let best=null;
  for (const m of METRICS){
    const by={}; SLOTS.forEach(([s])=>{ const v=ents.filter(e=>e.slot===s&&e.m[m.k]!=null).map(e=>e.m[m.k]); if (v.length>=5) by[s]=v; });
    const ks=Object.keys(by); if (ks.length<2) continue;
    const hi=ks.reduce((a,b)=>mean(by[a])>=mean(by[b])?a:b), lo=ks.reduce((a,b)=>mean(by[a])<=mean(by[b])?a:b);
    const w=welch(by[hi],by[lo]); const spread=mean(by[hi])-mean(by[lo]);
    if (w && w.p<0.01 && spread>=0.5 && (!best||spread>best.spread)) best={m,hi,lo,spread,mh:mean(by[hi]),ml:mean(by[lo])};
  }
  if (best) cards.push({k:'Time of day', tag:'Pattern', title:`${best.m.label} tends to be highest in the ${best.hi} (${fmt(best.mh)}) and lowest in the ${best.lo} (${fmt(best.ml)}).`});
  stability(A.ctx).forEach(s=>{ if (s.now==null||s.prev==null||cards.length>=3) return;
    const d=s.now-s.prev; if (Math.abs(d)>=0.4 && (d>0?s.now>=1.3*s.prev:s.now<=0.77*s.prev))
      cards.push({k:'Stability', tag:'Trend', title:`${LAB(s.k)} has been ${d>0?'less':'more'} steady over the last 2 weeks.`, body:`Average day-to-day swing ${fmt(s.now)} points, vs ${fmt(s.prev)} the 2 weeks before.`}); });
  let tc=0;
  for (const m of METRICS){ const t=trendOf(A.ctx.dmAll,m.k); if (t.delta!=null && Math.abs(t.delta)>=0.6 && tc<2){ tc++;
    cards.push({k:'This week', tag:'Trend', title:`${m.label} is ${t.delta>0?'up':'down'} ${fmt(Math.abs(t.delta))} points vs the week before.`, body:`7-day average ${fmt(t.now)}.`}); } }
  return cards;
}
function buildFindings(A){
  const hints=[], cats={same:[], tag:[], next:[], hr:[], combo:[], tagSleep:[]}, per={}, perTag={}, perTS={};
  const byConf=(a,b,ea,eb)=>CONF_RANK(b.conf)-CONF_RANK(a.conf)||eb-ea;
  A.assoc.filter(t=>(t.dir==='same'||t.dir==='next')&&t.conf).sort((a,b)=>byConf(a,b,Math.abs(a.rho),Math.abs(b.rho))).forEach(t=>{
    if (t.conf==='hint'){ if (hints.length<6) hints.push(assocCard(t)); return; }
    const key=t.dir+t.mk; if (per[key]) return; per[key]=1; cats[t.dir].push(assocCard(t));
  });
  A.tm.cells.filter(c=>c.conf).sort((a,b)=>byConf(a,b,Math.abs(a.b),Math.abs(b.b))).forEach(c=>{
    if (c.conf==='hint'){ if (hints.length<6) hints.push(tagCard(c)); return; }
    if (perTag[c.tag]) return; perTag[c.tag]=1; cats.tag.push(tagCard(c));
  });
  A.ts.cells.filter(c=>c.conf).sort((a,b)=>byConf(a,b,Math.abs(a.b/a.sdY),Math.abs(b.b/b.sdY))).forEach(c=>{
    if (c.conf==='hint'){ if (hints.length<6) hints.push(tagSleepCard(c)); return; }
    if (perTS[c.tag]) return; perTS[c.tag]=1; cats.tagSleep.push(tagSleepCard(c));
  });
  A.cb.forEach(c=>cats.combo.push(comboCard(c)));
  if (A.hm) A.hm.tests.filter(t=>t.conf).sort((a,b)=>byConf(a,b,Math.abs(a.rho),Math.abs(b.rho))).forEach(t=>{ if (t.conf==='hint'){ if (hints.length<6) hints.push(hrCard(t)); } else cats.hr.push(hrCard(t)); });
  const caps={same:3, tag:3, next:2, hr:1, combo:1, tagSleep:2}, main=[];
  for (let round=0; round<3 && main.length<9; round++)
    for (const c of Object.keys(cats)){ if (round<caps[c] && cats[c][round] && main.length<9) main.push(cats[c][round]); }
  return {main, extra:patternCards(A), hints};
}
function outlookHtml(ol){
  if (!ol || !ol.ok) return '';

  if (ol.noToday) return `<div class="card outlook"><span class="kicker">Today's outlook</span><p class="muted" style="margin:6px 0 0">Sync or import today's Oura data and a forecast for today will appear here. On your past data it has been ${rel}.</p></div>`;
  const head={harder:'Today might feel harder than usual', better:'Today looks like a good day', typical:'Today looks like a fairly typical day'}[ol.verdict];
  const tip={harder:'Go easy on yourself and keep plans light where you can.', better:'A good day to take on something you have been putting off.', typical:''}[ol.verdict];
  const why=ol.reasons&&ol.reasons.length?`Mainly because: ${ol.reasons.map(r=>`${ouraMeta(r.k).label.toLowerCase()} ${r.z>0?'higher':'lower'} than usual`).join(', ')}.`:'';
  return `<div class="card outlook ${ol.verdict}"><span class="kicker">Today's outlook</span><h2>${head}</h2>${why?`<p class="sub" style="margin:0">${esc(why)}</p>`:''}${tip?`<p class="small" style="margin:6px 0 0">${tip}</p>`:''}
    <details class="stats"><summary>How sure is this?</summary><p class="small muted">Forecast from last night's Oura data and the day of the week, fitted on your past ${ol.n} days. Checked on days it wasn't fitted to, it lined up with how your days actually went at r = ${ol.rcv.toFixed(2)} (${rel}). It describes your typical pattern, not a certainty.</p></details></div>`;
}
function digestHtml(A,F){
  const t=new Date(), dmA=A.ctx.dmAll, rows=[];

    if (w.length>=3 && b.length>=7) rows.push({k, now:mean(w), delta:mean(w)-mean(b)});
  }
  const top=F.main.filter(c=>c.conf).slice(0,2), ax=activeExp();

      return `<span>${LAB(r.k)}</span><span><b>${fmt(r.now)}</b> <span class="muted small">${sgn(r.delta)} vs usual</span></span>${w}`; }).join('')}</div>

  if (top.length) h+=`<h3 style="margin:14px 0 4px">Strongest findings</h3>${top.map(c=>`<p style="margin:4px 0">${confPill(c.conf)} ${esc(c.title)}</p>`).join('')}`;
  if (!ax && A.sugg.length){ const s=A.sugg[0]; h+=`<h3 style="margin:14px 0 4px">Try this</h3><p style="margin:0">${esc(s.name)} for 2 weeks <span class="muted small">(${esc(s.why)})</span></p><div class="row"><button class="btn" data-act="exp-suggest" data-name="${esc(s.name)}" data-focus="${s.focus}">Set up this experiment</button></div>`; }
  if (ax) h+=`<p class="small" style="margin:12px 0 0">Experiment running: <b>${esc(ax.name)}</b>${todayStr()>=ax.start?` · day ${daysBetween(ax.start,todayStr())+1} of ${ax.days}`:''}.</p>`;

    case 'daily_readiness': put('readiness_score',r.score); put('temp_dev',r.temperature_deviation); break;
    case 'daily_activity': put('activity_score',r.score); put('steps',r.steps); put('active_cal',r.active_calories); break;

  if ('steps' in r) return 'daily_activity'; if ('temperature_deviation' in r) return 'daily_readiness';
  if ('stress_high' in r) return 'daily_stress'; if ('spo2_percentage' in r) return 'daily_spo2';

async function ouraGet(path,params,token){

    if (res.status===401||res.status===403) throw new OuraErr('auth',res.status);
    if (!res.ok) throw new OuraErr('http',res.status);

  }

}

function parseCsv(text){
  text=text.replace(/^﻿/,''); const first=text.split(/\r?\n/,1)[0]||'';

  const rows=[]; let row=[],cur='',q=false;
  for (let i=0;i<text.length;i++){
    const c=text[i];
    if (q){ if (c==='"'){ if (text[i+1]==='"'){ cur+='"'; i++; } else q=false; } else cur+=c; }
    else if (c==='"') q=true;
    else if (c===delim){ row.push(cur); cur=''; }
    else if (c==='\n'||c==='\r'){ if (c==='\r'&&text[i+1]==='\n') i++; row.push(cur); cur=''; if (row.length>1||row[0]!=='') rows.push(row); row=[]; }

}

}

  if (/lowest_heart_rate|lowest_hr|resting_heart_rate/.test(n)) return {k:'lowest_hr'};
  if (/^(average|avg)_(heart_rate|hr)/.test(n)) return {k:'avg_hr'};
  if (/total_sleep(_duration)?$|^sleep_duration$/.test(n)) return {k:'total_sleep_h', conv:m=>m>1000?1/3600:m>24?1/60:1};
  if (/^deep_sleep(_duration)?$/.test(n)) return {k:'deep_min', conv:m=>m>300?1/60:1};
  if (/^rem_sleep(_duration)?$/.test(n)) return {k:'rem_min', conv:m=>m>300?1/60:1};
  if (/^(sleep_)?latency$/.test(n)) return {k:'latency_min', conv:m=>m>300?1/60:1};
  if (/^(sleep_)?efficiency$/.test(n)) return {k:'sleep_eff'};

  if (n==='stress_high') return {k:'stress_high_min', conv:m=>m>1440?1/60:1};

function importCsv(fname,text){
  const rows=parseCsv(text); if (rows.length<2) return {days:0,cols:0};
  const head=rows[0].map(h=>h.trim());
  const norm=head.map(h=>h.toLowerCase().replace(/[^a-z0-9]+/g,'_'));
  let dcol=-1; for (const c of ['day','date','summary_date','calendar_date','timestamp','bedtime_end','bedtime_start']){ dcol=norm.indexOf(c); if (dcol>=0) break; }
  if (dcol<0) return {days:0,cols:0,skipped:true};
  const body=rows.slice(1).filter(r=>r.length>1);
  const base=slug(fname.split('/').pop()); const cols=[]; let customCount=0;
  head.forEach((h,ci)=>{
    if (ci===dcol) return;
    const vals=body.map(r=>toNum(r[ci])); const okv=vals.filter(v=>v!=null);
    if (okv.length<Math.max(2,body.length*0.5)) return;
    if (/(^|_)id$|timezone|offset|^index$|^unnamed/.test(norm[ci])) return;
    const m=maxOf(okv); let map=mapCol(h,fname);

    if (customCount>=30) return; customCount++;

async function importFiles(files){
  const log=[]; let totalDays=0, backups=0;
  if (S.demo) removeDemo(true);
  const handle=async(name,text)=>{
    const short=name.split('/').pop();
    if (/\.csv$/i.test(name)){
      if (/ringconfig/i.test(name)) return;
      if (/heart.?rate/i.test(name)){ const n=importHrCsv(text); if (n){ totalDays+=n; log.push(`${short}: heart rate for ${n} days`); } return; }
      const r=importCsv(name,text); if (r.days){ totalDays+=r.days; log.push(`${short}: ${r.days} days, ${r.cols} metrics`); }
    } else if (/\.json$/i.test(name)){

    ${days.length?`<dl class="kv"><dt>Days loaded</dt><dd>${days.length} (${days[0]} → ${days[days.length-1]})</dd><dt>Metrics</dt><dd>${keys.length}</dd><dt>Heart rate</dt><dd>${hrDays?hrDays+' days':'none yet'}</dd><dt>Last sync</dt><dd>${last}</dd></dl>`:'<p class="muted" style="margin:0">No Oura data yet.</p>'}
    <h3 style="margin-top:14px">Import a file</h3>
    <p class="muted small" style="margin:4px 0 8px">Your Oura data export (.zip), or individual .csv / .json files. Known columns (sleep, HRV, readiness, activity…) are matched automatically, and every other numeric column becomes a metric you can compare. The heart-rate file powers "heart rate before check-ins".</p>
    <label class="btn" style="cursor:pointer">Choose files<input type="file" id="oura-file" multiple accept=".zip,.csv,.json,application/zip,text/csv,application/json" hidden></label>
    <p id="import-msg" class="${IMPORT_MSG.cls||'small'}" role="status">${esc(IMPORT_MSG.text)}</p>
    <details ${ouraConnected()||OURA_MSG.text?'open':''}><summary>Auto-sync (sign in with Oura)</summary>
      ${ouraConnected()?`
      <p class="muted small">Connected to Oura. Access is a short-lived token this browser refreshes itself; nothing but these requests ever leaves this device.</p>
      <div class="row"><button class="primary" data-act="sync-oura">Sync now</button><button class="link danger" data-act="disconnect-oura">Disconnect</button></div>`:`
      <p class="muted small">Oura retired personal access tokens, so this signs in the same way the Oura app does: a one-time Client ID and Worker URL from your own setup (see SETUP.md), then a normal Oura login. Details on this device only.</p>
      <div class="field"><input type="text" id="oura-client-id" placeholder="Oura app Client ID" autocomplete="off" autocapitalize="off" spellcheck="false" value="${esc(loadOauth().client_id||'')}"></div>
      <div class="field"><input type="text" id="oura-worker-url" placeholder="Worker URL (https://…workers.dev)" autocomplete="off" autocapitalize="off" spellcheck="false" value="${esc(loadOauth().worker_url||'')}"></div>
      <div class="row"><button class="primary" data-act="connect-oura">Connect to Oura</button></div>`}
      <p id="oura-msg" class="${OURA_MSG.cls||'small'}" role="status">${esc(OURA_MSG.text)}</p></details>
  </div>

  <div class="section-t">Reminders</div>
  <div class="card">
    <p class="muted small" style="margin:0 0 8px">Check-ins per day (1 to 3). A web app can't ring your phone when it's closed, so download a calendar file and add it to your phone's calendar for real notifications.</p>
    ${rem.map((t,i)=>`<div class="trow"><input type="time" value="${esc(t)}" data-rem="${i}" aria-label="Reminder ${i+1}"> ${rem.length>1?`<button class="link danger" data-act="rem-del" data-i="${i}">Remove</button>`:''}</div>`).join('')}
    <div class="row">${rem.length<3?'<button class="btn" data-act="rem-add">Add a time</button>':''}<button class="primary" data-act="ics">Download calendar reminders (.ics)</button></div>
  </div>

  <div class="section-t">Tags</div>
  <div class="card"><div class="chips">${S.settings.tags.map(t=>`<button class="chip" data-act="tag-del" data-t="${esc(t)}" aria-label="Remove tag ${esc(t)}">${esc(t)}<span class="x">×</span></button>`).join('')}</div>
    <div class="row"><input type="text" id="new-tag" maxlength="24" placeholder="New tag" style="max-width:200px"><button class="btn" data-act="tag-add">Add</button></div>
    <p class="muted small" style="margin:8px 0 0">Removing a tag keeps it on past check-ins.</p>
    <p class="small" style="margin:14px 0 6px">In the analysis, a tag counts for:</p>
    <div class="seg" role="group" aria-label="Tag scope"><button data-act="tag-scope" data-v="checkin" aria-pressed="${S.settings.tagScope!=='day'}">Just that check-in</button><button data-act="tag-scope" data-v="day" aria-pressed="${S.settings.tagScope==='day'}">Rest of that day</button></div>
    <p class="muted small" style="margin:6px 0 0">"Rest of that day" lets morning caffeine show up in your afternoon and evening check-ins.</p></div>

  <div class="section-t">Weekly check (PHQ-4)</div>
  <div class="card"><p class="muted small" style="margin:0 0 8px">Four standard questions once a week, about 30 seconds. ${S.phq.length} taken so far. It's ${S.settings.phq4?'on':'off'}.</p>
    <div class="row" style="margin-top:0"><button class="btn" data-act="phq-toggle">${S.settings.phq4?'Turn off':'Turn on'}</button><button class="btn" data-act="phq-now">Take it now</button></div></div>

  <div class="section-t">Backup & export</div>
  <div class="card">
    <p class="muted small" style="margin:0 0 8px">Your data lives only in this browser. Back it up now and then (${S.settings.lastBackup?'last backup '+new Date(S.settings.lastBackup).toLocaleDateString():'no backup yet'}).</p>
    <div class="row" style="margin-top:0"><button class="primary" data-act="export-json">Backup (.json)</button><button class="btn" data-act="export-daily">Daily table (.csv)</button><button class="btn" data-act="export-checkins">Check-ins (.csv)</button></div>
    <p class="muted small" style="margin:10px 0 4px">Restore from a backup (adds anything missing, keeps what you have):</p>
    <label class="btn" style="cursor:pointer">Choose backup file<input type="file" id="restore-file" accept=".json,application/json" hidden></label>
    <p class="muted small" style="margin:10px 0 0">The daily table has one row per day with check-in averages, the overall score, weekly check scores, experiment periods and every Oura metric, ready for Power BI, Excel or SQL.</p>
  </div>

  <div class="section-t">Demo & reset</div>
  <div class="card">
    ${S.demo?`<p style="margin:0 0 8px">Demo data is loaded (12 weeks of made-up check-ins, Oura data, heart rate, weekly checks and one finished experiment).</p><button class="btn" data-act="remove-demo">Remove demo data</button>`
      :`<p class="muted small" style="margin:0 0 8px">Want to see the insights before you have data? Load clearly labelled fake data, then remove it with one tap.</p><button class="btn" data-act="load-demo" ${(S.entries.length||days.length)?'disabled':''}>Load demo data</button>${(S.entries.length||days.length)?'<span class="muted small"> (only available when the app is empty)</span>':''}`}
    <div class="row" style="margin-top:16px"><button class="link danger" data-act="wipe">Delete all data on this device</button></div>
  </div>

  <div class="section-t">About</div>
  <div class="card"><p class="small" style="margin:0">Pulse Check keeps everything on this device. Nothing is uploaded anywhere except requests you trigger to Oura. It's a personal tracking tool, not medical advice or a diagnosis. The weekly check uses the PHQ-4 (Kroenke, Spitzer, Williams & Löwe, 2009), which is free to use. If you are in distress or thinking about harming yourself, call or text 988 (US) or your local emergency number.</p></div>`;
}

function download(name,text,type){
  const url=URL.createObjectURL(new Blob([text],{type})); const a=document.createElement('a'); a.href=url; a.download=name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(url),4000);
}
const csvCell = v => { v=v==null?'':String(v); return /[",\n\r]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v; };
const csvRow = a => a.map(csvCell).join(',');
function exportCheckins(){
  const hrm=hrDeltaMap();
  const lines=[csvRow(['date','time','slot','mood','anxiety','stress','energy','tags','note','hr_vs_usual_bpm'])];
  [...S.entries].sort((a,b)=>a.ts-b.ts).forEach(e=>{ const hd=hrm&&hrm.get(e.id); lines.push(csvRow([e.date, new Date(e.ts).toTimeString().slice(0,5), e.slot, ...METRICS.map(m=>e.m[m.k]), e.tags.join('; '), e.note, hd?hd.delta.toFixed(1):''])); });
  download('pulsecheck-checkins.csv', lines.join('\n'), 'text/csv');
}
function exportDaily(){
  const dm=addOverall(dayMap('all')), cnt={}; S.entries.forEach(e=>cnt[e.date]=(cnt[e.date]||0)+1);
  const phq={}; S.phq.forEach(p=>phq[p.date]=phqScore(p).total);
  const expOn=d=>{ const x=S.experiments.find(x=>d>=x.start&&d<=expLast(x)); return x?x.name:''; };
  const keys=ouraKeys(); const dates=[...new Set([...Object.keys(dm),...Object.keys(S.oura.days)])].sort();
  const lines=[csvRow(['date','checkins',...METRICS.map(m=>m.k),'overall','phq4_total','experiment',...keys])];
  dates.forEach(d=>lines.push(csvRow([d, cnt[d]||0, ...METRICS.map(m=>dm[d]&&dm[d][m.k]!=null?dm[d][m.k].toFixed(2):''), dm[d]&&dm[d].overall!=null?dm[d].overall.toFixed(2):'', phq[d]!=null?phq[d]:'', expOn(d), ...keys.map(k=>S.oura.days[d]&&S.oura.days[d][k]!=null?S.oura.days[d][k]:'')])));
  download('pulsecheck-daily.csv', lines.join('\n'), 'text/csv');
}
function exportJson(){
  download('pulsecheck-backup-'+todayStr()+'.json', JSON.stringify({app:'pulsecheck', version:2, exportedAt:new Date().toISOString(), entries:S.entries, oura:{days:S.oura.days, labels:S.oura.labels}, hr:S.hr, phq:S.phq, experiments:S.experiments, settings:S.settings}), 'application/json');
  S.settings.lastBackup=Date.now(); save(); toast('Backup downloaded'); renderData();
}
function makeIcs(){
  const fold=l=>{ let o=''; while (l.length>74){ o+=l.slice(0,74)+'\r\n '; l=l.slice(74); } return o+l; };
  const url=/^https?:/.test(location.href)?location.href.split('#')[0]:'';
  const now=new Date(), stamp=now.toISOString().replace(/[-:]/g,'').replace(/\.\d+/,'');
  const out=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//PulseCheck//EN','CALSCALE:GREGORIAN'];
  S.settings.reminders.forEach((t,i)=>{
    const [hh,mm]=t.split(':').map(Number); const start=new Date(now.getFullYear(),now.getMonth(),now.getDate(),hh,mm);
    if (start<now) start.setDate(start.getDate()+1);
    out.push('BEGIN:VEVENT',`UID:pulsecheck-${i}-${t.replace(':','')}@pulsecheck.local`,'DTSTAMP:'+stamp,
      `DTSTART:${ymd(start).replace(/-/g,'')}T${pad(hh)}${pad(mm)}00`,'DURATION:PT10M','RRULE:FREQ=DAILY','SUMMARY:Pulse Check-in',
      fold('DESCRIPTION:20-second check-in.'+(url?' Open: '+url:'')), ...(url?[fold('URL:'+url)]:[]),
      'BEGIN:VALARM','TRIGGER:PT0M','ACTION:DISPLAY','DESCRIPTION:Pulse Check-in','END:VALARM','END:VEVENT');
  });
  out.push('END:VCALENDAR'); return out.join('\r\n');
}

/* =====================================================================
   Routing + events
   ===================================================================== */
const TABS=['checkin','insights','history','data'];
const currentTab=()=>{ const h=(location.hash||'#checkin').slice(1); return TABS.includes(h)?h:'checkin'; };
function show(keepScroll){
  const t=currentTab();
  TABS.forEach(x=>{ $('#view-'+x).hidden=x!==t; });
  $$('.tabs a').forEach(a=>a.setAttribute('aria-current',a.dataset.tab===t?'page':'false'));
  ({checkin:()=>{ renderHero(); renderPhq(); syncForm(); }, insights:renderInsights, history:renderHistory, data:renderData})[t]();
  if (!keepScroll) window.scrollTo(0,0);
}
window.addEventListener('hashchange',()=>show(false));
document.addEventListener('visibilitychange',()=>{ if (!document.hidden && currentTab()==='checkin'){ renderHero(); renderPhq(); } });

function fillExperiment(name,focus){
  const go=()=>{ const n=$('#exp-name'), f=$('#exp-focus'), box=$('#exp-form'); if (!n) return; n.value=name; if (f&&focus) f.value=focus; box.scrollIntoView({behavior:'smooth',block:'start'}); n.focus({preventScroll:true}); };
  if (currentTab()!=='insights'){ location.hash='#insights'; setTimeout(go,50); } else go();
}

document.addEventListener('click',async ev=>{
  const b=ev.target.closest('[data-act]');
  if (!b){ const r=ev.target.closest('svg.cal rect[data-d]'); if (r){ const d=parseYmd(r.dataset.d); toast(d.toLocaleDateString([], {weekday:'short',month:'short',day:'numeric'})+(r.dataset.v?` · ${M[UI.pat].label} ${r.dataset.v}`:' · no check-ins')); } return; }
  const a=b.dataset.act;
  switch(a){
    case 'pick': { const k=b.dataset.k, v=+b.dataset.v; if (FORM.m[k]===v) delete FORM.m[k]; else FORM.m[k]=v; syncForm(); break; }
    case 'clear-metric': delete FORM.m[b.dataset.k]; syncForm(); break;
    case 'tag': { const t=b.dataset.t; FORM.tags.has(t)?FORM.tags.delete(t):FORM.tags.add(t); syncForm(); break; }
    case 'change-when': { const wi=$('#when-input'); wi.hidden=!wi.hidden; wi.max=toLocalInput(Date.now()); wi.value=toLocalInput(FORM.ts||Date.now()); if (!wi.hidden) wi.focus(); break; }
    case 'cancel-edit': resetForm(); break;
    case 'edit': { const e=S.entries.find(x=>x.id===b.dataset.id); if (!e) break; FORM={m:Object.assign({},e.m), tags:new Set(e.tags), note:e.note||'', ts:e.ts, editId:e.id}; if (location.hash==='#checkin') show(false); else location.hash='#checkin'; break; }
    case 'del': if (confirm('Delete this check-in?')){ S.entries=S.entries.filter(x=>x.id!==b.dataset.id); save(); renderHistory(); toast('Deleted'); } break;
    case 'more-hist': UI.histLimit+=60; renderHistory(); break;
    case 'range': UI.range=+b.dataset.v; renderInsights(); break;
    case 'toggle-all': UI.showAll=!UI.showAll; renderInsights(); break;
    case 'pat': UI.pat=b.dataset.k; renderInsights(); break;
    case 'explore': if (b.dataset.dir) UI.dir=b.dataset.dir; UI.mk=b.dataset.mk; UI.ok=b.dataset.ok; renderInsights(); { const x=$('#explore'); if (x) x.scrollIntoView({behavior:'smooth',block:'start'}); } break;
    case 'load-demo': loadDemo(); show(true); break;
    case 'remove-demo': removeDemo(); show(true); break;
    case 'connect-oura': await connectOura($('#oura-client-id').value, $('#oura-worker-url').value); break;
    case 'disconnect-oura': disconnectOura(); renderData(); break;
    case 'sync-oura': await syncOura(); break;
    case 'rem-add': if (S.settings.reminders.length<3){ S.settings.reminders.push('14:00'); S.settings.reminders.sort(); save(); renderData(); } break;
    case 'rem-del': S.settings.reminders.splice(+b.dataset.i,1); save(); renderData(); break;
    case 'ics': download('pulsecheck-reminders.ics', makeIcs(), 'text/calendar'); toast('Open the file to add the reminders to your calendar'); break;
    case 'tag-add': { const i=$('#new-tag'), t=i.value.trim(); if (t && !S.settings.tags.includes(t)){ S.settings.tags.push(t); save(); renderTagChips(); renderData(); } break; }
    case 'tag-del': S.settings.tags=S.settings.tags.filter(t=>t!==b.dataset.t); save(); renderTagChips(); FORM.tags.delete(b.dataset.t); renderData(); break;
    case 'tag-scope': S.settings.tagScope=b.dataset.v==='day'?'day':'checkin'; save(); renderData(); break;
    case 'export-json': exportJson(); break;
    case 'export-daily': exportDaily(); break;
    case 'export-checkins': exportCheckins(); break;
    case 'phq-open': PHQF.open=true; renderPhq(); break;
    case 'phq-cancel': PHQF={open:false, items:[null,null,null,null], result:null}; renderPhq(); break;
    case 'phq-pick': PHQF.items[+b.dataset.i]=+b.dataset.v; renderPhq(); break;
    case 'phq-save': { if (PHQF.items.some(v=>v==null)) break; const p={id:uid(), ts:Date.now(), date:todayStr(), items:PHQF.items.slice()}; S.phq.push(p); save(); PHQF={open:false, items:[null,null,null,null], result:p}; renderPhq(); break; }
    case 'phq-done': PHQF.result=null; renderPhq(); break;
    case 'phq-snooze': S.settings.phqSnooze=Date.now()+20*3600e3; save(); renderPhq(); break;
    case 'phq-off': S.settings.phq4=false; save(); renderPhq(); toast('Weekly check turned off. Turn it back on in the Data tab.'); break;
    case 'phq-toggle': S.settings.phq4=!S.settings.phq4; S.settings.phqSnooze=0; save(); renderData(); break;
    case 'phq-now': PHQF={open:true, items:[null,null,null,null], result:null}; location.hash='#checkin'; break;
    case 'exp-suggest': if (activeExp()){ toast('Finish or end the current experiment first'); break; } fillExperiment(b.dataset.name, b.dataset.focus); break;
    case 'exp-start': {
      if (activeExp()){ toast('An experiment is already running'); break; }
      const name=($('#exp-name').value||'').trim(); if (!name){ toast('Give the experiment a name first'); $('#exp-name').focus(); break; }
      const start=+$('#exp-start').value?ymd(addDays(new Date(),1)):todayStr();
      S.experiments.push({id:uid(), name, focus:$('#exp-focus').value, start, days:+$('#exp-days').value, created:Date.now()}); save(); renderInsights(); toast('Experiment started. Keep checking in as usual.'); break; }
    case 'exp-end': { const x=S.experiments.find(x=>x.id===b.dataset.id); if (!x) break;
      if (todayStr()<x.start){ S.experiments=S.experiments.filter(y=>y!==x); } else { x.ended=todayStr(); } save(); renderInsights(); break; }
    case 'exp-del': if (confirm('Delete this experiment? Your check-ins are kept.')){ S.experiments=S.experiments.filter(x=>x.id!==b.dataset.id); save(); renderInsights(); } break;
    case 'wipe': if (confirm('Delete ALL check-ins and Oura data on this device? This cannot be undone.') && confirm('Really delete everything? Consider a backup first.')){ S=defaults(); save(); disconnectOura(); resetForm(); renderTagChips(); show(true); toast('All data deleted'); } break;
  }
});
document.addEventListener('keydown',ev=>{ if ((ev.key==='Enter'||ev.key===' ') && ev.target.matches('td[data-act=explore]')){ ev.preventDefault(); ev.target.click(); } });
document.addEventListener('input',ev=>{ if (ev.target.id==='note') FORM.note=ev.target.value; });
document.addEventListener('change',async ev=>{
  const t=ev.target;
  if (t.dataset.sel){ const k=t.dataset.sel; if (k==='base') UI.base=t.checked; else UI[k]=t.value; renderInsights(); return; }
  if (t.id==='when-input'){ const ts=t.value?new Date(t.value).getTime():null; FORM.ts=ts&&!isNaN(ts)?ts:null; syncForm(); return; }
  if (t.dataset.rem!==undefined){ if (/^\d{2}:\d{2}$/.test(t.value)){ S.settings.reminders[+t.dataset.rem]=t.value; save(); } return; }
  if (t.id==='oura-file'){ const msg=$('#import-msg'); msg.className='small muted'; msg.textContent='Importing…';
    const r=await importFiles(Array.from(t.files)); t.value='';
    const good=r.totalDays||r.backups;
    IMPORT_MSG={cls:'small '+(good?'msg-ok':'msg-err'), text:r.log.length?r.log.join(' · '):'No Oura data found in those files.'};
    if (good) toast('Import finished ✓'); renderData(); return; }
  if (t.id==='restore-file'){ const r=await importFiles(Array.from(t.files)); t.value=''; toast(r.log.join(' · ')||'Nothing to restore'); renderData(); }
});
$('#checkin-form').addEventListener('submit',submitCheckin);

/* test hooks (read-only helpers) */
window.__pulsecheck = {state:()=>S, importCsv, importFiles, readZip, spearman, welch, regress, bh, ridgeFit, ingestApi, ingestHr, syncOura, makeIcs, loadDemo, show, UI, buildCtx, allAssoc, tagModel, tagSleepModel, hrModel, combos, outlook, dataQuality, expResult, threshold, phqCalib, loadOauth, saveOauth, connectOura, handleOuraCallback, getAccessToken, disconnectOura};

buildForm(); show(true);
handleOuraCallback().then(handled=>{ if (handled){ location.hash='#data'; show(true); } });
if ('serviceWorker' in navigator && /^https?:/.test(location.protocol)) navigator.serviceWorker.register('sw.js').catch(()=>{});
})();
